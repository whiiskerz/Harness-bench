name: WireForge Production Studio smoke
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - name: Check inline JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          text=Path('index.html').read_text()
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',text,re.S|re.I)
          Path('/tmp/wireforge-inline.js').write_text('\n'.join(scripts))
          print('Inline script bytes:',Path('/tmp/wireforge-inline.js').stat().st_size)
          PY
          node --check /tmp/wireforge-inline.js
      - name: Browser smoke test
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 &
          sleep 2
          node tests/production-studio-smoke.cjs

name: WireForge 3D studio smoke tests
on:
  push:
    branches:
      - main
  pull_request:
concurrency:
  group: wireforge-3d-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm install --no-save playwright three@0.160.1
          npx playwright install --with-deps chromium
      - name: Check JavaScript syntax
        run: |
          node --check render3d.js
          node --check render3d-hardware.js
          node --check render3d-wiring.js
          python3 - <<'PY'
          from pathlib import Path
          import re
          text=Path('index.html').read_text()
          inline=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',text,re.S|re.I)
          Path('/tmp/wireforge-inline.js').write_text('\n'.join(inline))
          PY
          node --check /tmp/wireforge-inline.js
      - name: Use local Three.js in browser tests
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('render3d.html')
          s=p.read_text().replace('https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js','/node_modules/three/build/three.module.js').replace('https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/','/node_modules/three/examples/jsm/')
          p.write_text(s)
          PY
      - name: Test live editor-to-3D integration
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 &
          sleep 2
          node tests/render3d-smoke.cjs
      - name: Upload 3D preview screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wireforge-3d-preview
          path: |
            wireforge-3d-test-preview.png
            wireforge-3d-desktop-realism.png
            wireforge-3d-showcase-titanium.png
          if-no-files-found: ignore
